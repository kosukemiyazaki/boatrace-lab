name: latency
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: curl timing breakdown
        run: |
          U="https://www.boatrace.jp/owpc/pc/race/odds3t?rno=1&jcd=02&hd=20260704"
          F='dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip} http=%{http_code} size=%{size_download}\n'
          getent ahosts www.boatrace.jp | head -5
          for opt in "" "-4" "-6" "--http1.1" "-A Mozilla/5.0"; do echo "== $opt"; curl -sS -o /dev/null $opt -w "$F" "$U" || true; done
          echo "== keepalive x3 (one connection)"; curl -sS -o /dev/null -o /dev/null -o /dev/null -w "$F" -A "Mozilla/5.0" "$U" "$U" "$U"
          echo "== mbrace"; curl -sS -o /dev/null -w "$F" https://www1.mbrace.or.jp/od2/K/202610/k261004.lzh
