name: probe
on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
      - run: python scripts/probe.py
      - uses: actions/upload-artifact@v4
        with: { name: probe_out, path: probe_out, retention-days: 7 }
