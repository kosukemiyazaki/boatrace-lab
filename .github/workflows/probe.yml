name: probe
on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq --no-install-recommends lhasa || (sudo apt-get update -qq && sudo apt-get install -y -qq lhasa)
      - run: python scripts/probe.py
      - name: commit probe_out to probe-out branch
        run: |
          cd probe_out
          git init -q -b probe-out
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" probe-out
