name: collect-odds
# 締切時3連単オッズを指定月だけ取得（B/K は data ブランチに取得済みの前提）
on:
  workflow_dispatch:
    inputs:
      months: { description: "YYYYMM をカンマ区切り（先頭から順に処理）", required: true }
      stride: { description: "N日に1日だけ取る", default: "3" }
permissions:
  contents: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { months: "${{ steps.p.outputs.months }}" }
    steps:
      - id: p
        run: echo "months=$(python3 -c 'import json,sys; print(json.dumps([m.strip() for m in sys.argv[1].split(",") if m.strip()]))' '${{ inputs.months }}')" >> "$GITHUB_OUTPUT"
  odds:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: { month: "${{ fromJson(needs.plan.outputs.months) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: store }
      - run: python3 scripts/fetch_odds.py ${{ matrix.month }} store --workers 4 --interval 1.0 --budget-min 300 --stride ${{ inputs.stride }}
      - name: push
        if: always()
        run: bash scripts/push_store.sh "odds ${{ matrix.month }} stride ${{ inputs.stride }}"
