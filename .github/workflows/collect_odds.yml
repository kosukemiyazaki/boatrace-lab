name: collect-odds
# boatrace.jp のレース別ページ（既定: 締切時3連単オッズ）を指定月だけ取得（B/K は data ブランチに取得済みの前提）
on:
  workflow_dispatch:
    inputs:
      months: { description: "YYYYMM をカンマ区切り（先頭から順に処理）", required: true }
      stride: { description: "N日に1日だけ取る", default: "1" }
      pages: { description: "odds3t / oddstf / beforeinfo をカンマ区切り", default: "odds3t" }
permissions:
  contents: write
concurrency: { group: "collect-${{ inputs.pages }}", cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { jobs: "${{ steps.p.outputs.jobs }}" }
    steps:
      - id: p
        shell: python
        run: |
          import json, os
          ms = [m.strip() for m in "${{ inputs.months }}".split(",") if m.strip()]
          ps = [p.strip() for p in "${{ inputs.pages || 'odds3t' }}".split(",") if p.strip()]
          jobs = [{"month": m, "page": p} for m in ms for p in ps]  # 月ごとに全ページ → 新しい月から揃う
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"jobs={json.dumps(jobs)}\n")
  odds:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: { job: "${{ fromJson(needs.plan.outputs.jobs) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: store }
      - run: python3 scripts/fetch_odds.py ${{ matrix.job.month }} store --page ${{ matrix.job.page }} --workers 4 --interval 1.0 --budget-min 300 --stride ${{ inputs.stride }}
      - name: push
        if: always()
        run: bash scripts/push_store.sh "${{ matrix.job.page }} ${{ matrix.job.month }} stride ${{ inputs.stride }}"
