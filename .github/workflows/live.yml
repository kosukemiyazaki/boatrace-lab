name: live
# レース当日、締切15分前・10分前・6分前のオッズ（3連単・単勝複勝）と6分前の直前情報を取得して data ブランチに保存する。
# 6分前の取得の直後に、凍結モデル（models/frozen_v4）で予想（確率のみ。買い目は出さない）を計算して live_pred/ に保存する。
# GitHub の定期起動は数時間遅れたり起動しなかったりするので、ジョブの最後に次のジョブを自分で起動して途切れないようにする。
#   07:00〜23:05 JST : 最長5時間45分取得して、次を起動
#   それ以外の時間    : 翌朝07:30まで待つだけ（最長5時間40分）して、次を起動
# 定期起動（1時間おき）は鎖が切れたときの予備。同時に動くのは1本だけ（concurrency）。
on:
  schedule:
    - cron: "35 22,23 * * *"
    - cron: "5 0-13 * * *"
  workflow_dispatch:
    inputs:
      until: { description: "終了時刻 HH:MM (JST)。空なら自動", default: "" }
permissions:
  contents: write
  actions: write
concurrency: { group: live, cancel-in-progress: false }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: mode
        id: u
        shell: python
        run: |
          import datetime as d, os
          j = d.timezone(d.timedelta(hours=9)); n = d.datetime.now(j)
          start, end = n.replace(hour=7, minute=0, second=0), n.replace(hour=23, minute=5, second=0)
          until = "${{ inputs.until }}"
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if until or start <= n < end:
              u = until or min(n + d.timedelta(minutes=345), end).strftime("%H:%M")
              out.write(f"mode=run\nuntil={u}\n"); print("run until", u)
          else:
              wake = n.replace(hour=7, minute=30, second=0)
              if wake <= n:
                  wake += d.timedelta(days=1)
              s = int(min((wake - n).total_seconds(), 340 * 60))
              out.write(f"mode=sleep\nsleep={s}\n"); print("sleep", s)
      - uses: actions/checkout@v4
        if: steps.u.outputs.mode == 'run'
      - uses: actions/checkout@v4
        if: steps.u.outputs.mode == 'run'
        with: { ref: data, path: store }
      - if: steps.u.outputs.mode == 'run'
        run: sudo apt-get install -y -qq --no-install-recommends lhasa || (sudo apt-get update -qq && sudo apt-get install -y -qq lhasa)
      - name: prepare prediction in background
        if: steps.u.outputs.mode == 'run'
        # 締切前の予想の準備（ライブラリ・データセット）。取得は待たずに始め、準備ができてから予想を始める
        run: |
          nohup bash -c "pip install -q pandas pyarrow numpy scipy scikit-learn lightgbm && python3 scripts/build_dataset.py store ds --no-odds && touch ds/READY" > prep.log 2>&1 &
      - if: steps.u.outputs.mode == 'run'
        run: python3 scripts/live_snapshot.py store --until ${{ steps.u.outputs.until }} --model models/frozen_v4 --datadir ds
      - name: prep log
        if: always() && steps.u.outputs.mode == 'run'
        run: tail -20 prep.log || true
      - name: push
        if: always() && steps.u.outputs.mode == 'run'
        run: bash scripts/push_store.sh "live $(TZ=Asia/Tokyo date +%Y%m%d) final"
      - name: sleep until morning
        if: steps.u.outputs.mode == 'sleep'
        run: sleep ${{ steps.u.outputs.sleep }}
      - name: start next job
        if: always() && !cancelled()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # 失敗して数秒で終わるジョブが連鎖しないよう、開始から最低10分あけて次を起動する
          el=$(( $(date +%s) - ${{ steps.start.outputs.t }} )); [ $el -lt 600 ] && sleep $(( 600 - el ))
          gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY"
