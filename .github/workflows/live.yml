name: live
# レース当日、締切15分前・10分前・6分前のオッズ（3連単・単勝複勝）と6分前の直前情報を取得して data ブランチに保存する。
# GitHub Actions のジョブは最長6時間なので、1本あたり最長5時間45分（23:05 JST まで）動かす。
on:
  # GitHub の定期起動は数時間遅れることがあるので、1時間おきに起動する（07:35〜22:05 JST）。
  # 同時に動くのは1本だけ（concurrency）。後から起動したものは前のジョブの終了を待って始まる。
  schedule:
    - cron: "35 22,23 * * *"
    - cron: "5 0-13 * * *"
  workflow_dispatch:
    inputs:
      until: { description: "終了時刻 HH:MM (JST)。空なら 起動から5時間45分後 と 23:05 の早い方", default: "" }
permissions:
  contents: write
concurrency: { group: live, cancel-in-progress: false }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: store }
      - run: sudo apt-get install -y -qq --no-install-recommends lhasa || (sudo apt-get update -qq && sudo apt-get install -y -qq lhasa)
      - name: until
        id: u
        run: |
          if [ -n "${{ inputs.until }}" ]; then u="${{ inputs.until }}"; else
            u=$(python3 -c "import datetime as d; j=d.timezone(d.timedelta(hours=9)); n=d.datetime.now(j); e=min(n+d.timedelta(minutes=345), n.replace(hour=23, minute=5)); print(e.strftime('%H:%M'))")
          fi
          echo "until=$u" >> "$GITHUB_OUTPUT"; echo "until=$u"
      - run: python3 scripts/live_snapshot.py store --until ${{ steps.u.outputs.until }}
      - name: push
        if: always()
        run: bash scripts/push_store.sh "live $(TZ=Asia/Tokyo date +%Y%m%d) final"
