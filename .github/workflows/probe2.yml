name: probe2
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe2.py
      - name: commit probe_out to probe-out branch
        run: |
          cd probe_out && git init -q -b probe-out
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "probe2 ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" probe-out
