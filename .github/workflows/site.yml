name: site
# 「券種ずれモニター」（スマホ用のページ）を作って Cloudflare Pages に載せる。
# data ブランチの記録から scripts/make_dashboard_data.py → scripts/make_dashboard_lite.py --site で一式を作り、wrangler で公開する。
# 必要なリポジトリのシークレット: CLOUDFLARE_API_TOKEN（Cloudflare Pages の編集権限）、CLOUDFLARE_ACCOUNT_ID。
# シークレットがなければ、作るところまでで止まる（公開しない）。
# ページにはボートレース公式の情報から作った数字が入るので、本人だけが見られるようにする：functions/_middleware.js がログインを挟む。
# パスワードはリポジトリのシークレット SITE_PASSWORD（20文字以上）。未設定の間、ページは閉じたままになる。
on:
  schedule:
    - cron: "20 2,5,8,10,12,14 * * *"   # 日本時間 11:20 / 14:20 / 17:20 / 19:20 / 21:20 / 23:20
  workflow_dispatch:
    inputs:
      days: { description: "何日分のせるか", default: "7" }
permissions:
  contents: read
concurrency: { group: site, cancel-in-progress: true }
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: store }
      - run: pip install -q pandas pyarrow numpy
      - run: python3 scripts/build_dataset.py store ds
      - run: python3 scripts/make_dashboard_data.py ds store combos.json --days ${{ inputs.days || '7' }}
      - run: python3 scripts/make_dashboard_lite.py combos.json site --site
      - name: deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          # 貼り付けで入りがちな空白・改行を取り除く
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          # 作成直後の画面の確認用コマンド（curl … "Authorization: Bearer <token>"）ごと貼られた場合は、トークンの部分だけを取り出す
          case "$CLOUDFLARE_API_TOKEN" in *Bearer*) export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/.*Bearer([A-Za-z0-9_-]+).*/\1/')";; esac
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare のシークレットが未設定のため公開しない（ページは作成済み）"; exit 0
          fi
          # 値は出さずに形だけ確かめる（長さ・使われている文字の種類・Cloudflare の検証結果）
          python3 - <<'PY'
          import os, re, json, urllib.request
          t = os.environ["CLOUDFLARE_API_TOKEN"]; a = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          print("token: 長さ", len(t), "／英数字と _ - だけか", bool(re.fullmatch(r"[A-Za-z0-9_-]+", t)))
          print("account id: 長さ", len(a), "／16進32桁か", bool(re.fullmatch(r"[0-9a-f]{32}", a)))
          try:
              r = urllib.request.urlopen(urllib.request.Request("https://api.cloudflare.com/client/v4/user/tokens/verify", headers={"Authorization": "Bearer " + t}), timeout=30)
              print("verify:", json.loads(r.read()).get("result", {}).get("status"))
          except Exception as e:
              print("verify: 失敗", getattr(e, "code", ""), (e.read()[:300].decode("utf-8", "replace") if hasattr(e, "read") else e))
          PY
          npx --yes wrangler@3.114.0 pages project create zure-monitor --production-branch=main 2>/dev/null || true
          # ログイン用：パスワードの SHA-256 だけを Pages のシークレットに置く（functions/_middleware.js が照合する）。
          # 未設定・20文字未満のときは登録しない。その場合ページは閉じたままになる（値も長さも出さない）。
          SITE_PASSWORD="$(printf '%s' "$SITE_PASSWORD" | tr -d '\r\n')"
          if [ "${#SITE_PASSWORD}" -ge 20 ]; then
            printf '%s' "$SITE_PASSWORD" | sha256sum | cut -d' ' -f1 | npx --yes wrangler@3.114.0 pages secret put SITE_PASSWORD_SHA256 --project-name=zure-monitor
          else
            echo "SITE_PASSWORD が未設定か 20 文字未満のため、ログイン用の値は登録しない（未登録ならページは閉じたまま）"
          fi
          npx --yes wrangler@3.114.0 pages deploy site --project-name=zure-monitor --branch=main --commit-dirty=true
