name: autorace-inspect
# オートレース公式（autorace.jp）のデータ取得の形を調べる。利用規約（私的利用の範囲、転載・頒布禁止、大量アクセス禁止）に従い、
# 取得した内容はどこにも保存・コミットしない。ログに出すのは エンドポイント名・パラメータ名・JSON のキー名と件数だけ（値は出さない）。
on:
  workflow_dispatch:
    inputs:
      venue: { default: "hamamatsu" }
      date: { default: "2026-08-01" }
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: python
        run: |
          import re, json, time, urllib.request, urllib.parse, http.cookiejar
          UA = {"User-Agent": "Mozilla/5.0 (boatrace-lab research; personal analysis)"}
          B = "https://autorace.jp"
          cj = http.cookiejar.CookieJar(); op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def get(u):
              time.sleep(2)
              with op.open(urllib.request.Request(u, headers=UA), timeout=60) as r: return r.read().decode("utf-8", "replace")
          v, d = "${{ inputs.venue }}", "${{ inputs.date }}"
          h = get(f"{B}/race_info/Live/{v}")
          tok = re.findall(r'name="csrf-token" content="([^"]+)"', h) or re.findall(r'_token["\']?\s*[:=]\s*["\']([^"\']+)', h)
          print("csrf token found:", bool(tok), "cookies:", [c.name for c in cj])
          srcs = re.findall(r'<script[^>]+src="([^"]+)"', h)
          print("scripts:", [s.split("?")[0] for s in srcs][:30])
          eps = set()
          for s in srcs:
              if not s.startswith("http"): s = B + s
              if "autorace.jp" not in s: continue
              try: js = get(s)
              except Exception as e: print("js NG", s, e); continue
              for m in re.finditer(r'race_info/[A-Za-z/]+', js): eps.add(m.group(0))
              for m in re.finditer(r'(placeCode|raceDate|raceNo|placeId|race_no|date)\b', js): eps.add("param:" + m.group(1))
          print("endpoints/params seen in JS:", sorted(eps))
          # race.js の各エンドポイント呼び出しの近くに出てくる識別子だけを表示（コードそのものは出さない）
          try:
              js = get(B + "/web_app/js/race.js")
              for ep in ("race_info/Program", "race_info/Odds", "race_info/RaceResult", "race_info/RaceRefund"):
                  for mm in list(re.finditer(re.escape(ep) + r"['\"]", js))[:2]:
                      w = js[max(0, mm.start() - 400): mm.end() + 400]
                      print(ep, "identifiers nearby:", sorted(set(re.findall(r"\b[a-zA-Z_][a-zA-Z0-9_]{2,}\b", w)))[:80])
          except Exception as e:
              print("race.js NG", e)
          # 今日の開催（XML）のタグ構造と、出走表・オッズの「選手一覧以外」のキー（締切時刻がどこにあるか）を調べる。値は数字を 9 に置き換えて表示
          mask = lambda t: re.sub(r"\d", "9", str(t))
          x = get(f"{B}/race_info/XML/Hold/Today")
          print("Hold/Today 先頭（数字は9に置換）:", mask(x[:1500]))
          pcs = sorted(set(re.findall(r"<placeCode>(\d+)</placeCode>", x))) or sorted(set(re.findall(r"placeCode\D{0,5}(\d+)", x)))
          ds = sorted(set(re.findall(r"(20\d\d-\d\d-\d\d)", x)))
          import datetime as _dt
          today = (_dt.datetime.utcnow() + _dt.timedelta(hours=9)).strftime("%Y-%m-%d")
          print("placeCodes:", pcs, "today:", today)
          hdr = dict(UA, **{"X-CSRF-TOKEN": tok[0] if tok else "", "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/x-www-form-urlencoded", "Referer": f"{B}/race_info/Live/{v}"})
          for pc in pcs[:2]:
              for ep in ("Program", "Odds"):
                  body = urllib.parse.urlencode({"placeCode": int(pc), "raceDate": today, "raceNo": 1}).encode()
                  try:
                      time.sleep(2)
                      with op.open(urllib.request.Request(f"{B}/race_info/{ep}", data=body, headers=hdr), timeout=60) as r: j = json.loads(r.read().decode("utf-8", "replace"))
                      bd = j.get("body")
                      print(pc, ep, "errors:", j.get("errors"), "top keys:", list(bd.keys()) if isinstance(bd, dict) else type(bd).__name__)
                      if isinstance(bd, dict):
                          for k2, v2 in bd.items():
                              if k2 in ("playerList",) or k2.endswith("OddsList"): continue
                              print("   ", k2, "=", mask(json.dumps(v2, ensure_ascii=False))[:600])
                  except Exception as e:
                      print(pc, ep, "NG", e)
